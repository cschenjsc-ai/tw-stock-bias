YAML
name: 自動更新台股每日乖離率

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1-5'

jobs:
  update-stock-data:
    runs-on: ubuntu-latest

    steps:
      - name: 檢出專案程式碼
        uses: actions/checkout@v3

      - name: 設定 Python 環境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安裝套件
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: 執行 Python 抓取與計算腳本
        run: python fetch_data.py

      - name: 自動將產出的 stocks.json 存回 GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add stocks.json
          git commit -m "Auto: 更新每日股市乖離率數據 [$(date +'%Y-%m-%d')]" || exit 0
          git push
